[package]
name = "challenge_pool"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
alloy-primitives = { version = "0.8", features = ["tiny-keccak"] }
alloy-sol-types  = "0.8"
mini-alloc       = "0.4.2"
stylus-sdk       = "0.8"
hex              = "0.4.3"
tiny-keccak      = { version = "2.0", features = ["keccak"] }

[build-dependencies]
alloy-primitives = { version = "0.8", features = ["tiny-keccak"] }

[features]
export-abi = ["stylus-sdk/export-abi"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "s"
