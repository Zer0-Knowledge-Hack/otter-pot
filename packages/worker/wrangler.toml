name = "otter-pot-worker"
main = "src/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# KV: estado del bot (config por grupo, wallets, armados, historial).
# Sin esto el estado vive en memoria y se pierde entre isolates de Workers.
[[kv_namespaces]]
binding = "BOT_KV"
id = "4d534dc1410c4776b80a5f779d749b5a"

[vars]
ENVIRONMENT = "development"

# Secretos (NUNCA en este archivo, ver AGENTS.md):
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   wrangler secret put OPERATOR_PRIVATE_KEY
#   wrangler secret put ARBITRUM_RPC_URL
