name = "otter-pot-worker"
main = "src/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# KV: estado del bot (config por grupo, wallets, armados, historial).
# Sin esto el estado vive en memoria y se pierde entre isolates de Workers.
[[kv_namespaces]]
binding = "BOT_KV"
id = "4d534dc1410c4776b80a5f779d749b5a"

# Configuración no secreta. Las direcciones desplegadas NO viven en este archivo:
# CHALLENGE_POOL_ADDRESS y USDC_ADDRESS se cargan en el dashboard de Cloudflare
# (Settings > Variables) o con `wrangler secret put`; en local, en `.dev.vars`.
# `keep_vars = true` (arriba, a nivel raíz) hace que `wrangler deploy` conserve las
# variables definidas en el dashboard en vez de borrarlas.
#
# CHAIN_ID es el de Arbitrum Sepolia. Tiene que coincidir con la red de
# CHAIN_RPC_URL o la firma se rechaza con «invalid chain id for signer».
[vars]
ENVIRONMENT = "development"
CHAIN_ID = "421614"

# Secretos y valores por entorno (NUNCA en este archivo, ver AGENTS.md):
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   wrangler secret put OPERATOR_PRIVATE_KEY
#   wrangler secret put CHAIN_RPC_URL
