name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rust contracts (packages/stylus/contracts/<contract>), each an independent crate.
  # Toolchain is pinned by rust-toolchain.toml at the repository root.
  contracts:
    name: contracts / ${{ matrix.contract }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract:
          - challenge_pool
          - treasury_vault
          - aave_strategy
          - mock_strategy
          - mock_usdc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy, rust-src
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/stylus/contracts/${{ matrix.contract }}
          key: ${{ matrix.contract }}

      - name: Format
        working-directory: packages/stylus/contracts/${{ matrix.contract }}
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: packages/stylus/contracts/${{ matrix.contract }}
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: packages/stylus/contracts/${{ matrix.contract }}
        run: cargo test --locked

  # TypeScript worker (bot/orchestrator), sweeper (cron) and Mini App.
  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable

      - name: Cache yarn packages
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint stylus scripts
        run: yarn stylus:lint --max-warnings=0

      - name: Lint worker
        run: yarn worker:lint

      - name: Test worker
        run: yarn worker:test

      - name: Type-check sweeper
        run: yarn sweeper:typecheck

      - name: Test sweeper
        run: yarn sweeper:test

      - name: Lint nextjs
        run: yarn next:lint --max-warnings=0

      - name: Check types on nextjs
        run: yarn next:check-types
