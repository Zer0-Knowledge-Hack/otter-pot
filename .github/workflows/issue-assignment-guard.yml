name: Issue assignment guard

# Only collaborators can take issues. If anyone else (a user without write access,
# a bot or an automated coding agent) is assigned, the assignment is reverted.

on:
  issues:
    types: [assigned]

permissions:
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Remove assignees who are not collaborators
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.payload.issue.number;
            const assignee = context.payload.assignee;

            let permission = "none";
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: assignee.login,
              });
              permission = data.permission;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const isCollaborator =
              assignee.type === "User" && ["admin", "maintain", "write"].includes(permission);
            if (isCollaborator) {
              core.info(`${assignee.login} is a collaborator (${permission}); assignment kept.`);
              return;
            }

            await github.rest.issues.removeAssignees({
              owner,
              repo,
              issue_number: issueNumber,
              assignees: [assignee.login],
            });
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body:
                `@${assignee.login} was removed from this issue: only project collaborators can take issues. ` +
                "See CONTRIBUTING.md (Repository access and review rules).",
            });
            core.warning(`Removed non-collaborator assignee ${assignee.login} (${assignee.type}, ${permission}).`);
